name: Build MemeVault

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 12 * * 0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверить Python-код
        run: python -m compileall -q .

      - name: Проверить наличие файлов проекта
        run: |
          test -f app.py
          test -f requirements.txt
          test -f templates/index.html
          echo "MemeVault: проверка завершена успешно!"
